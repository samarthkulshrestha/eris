[workspace]
members = ["crates/eris-compiler", "crates/eris-cli"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["Samarth Kulshrestha <samarthkulshrestha@protonmail.com>"]
license = "MIT"

[workspace.dependencies]
logos = "0.15.0"
inkwell = { version = "0.5", features = ["llvm17-0"] }
eris-compiler = { path = "crates/eris-compiler", version = "0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tempfile = "3"

[profile.dev]
debug = true
debug-assertions = true
overflow-checks = true
